    <meta name="theme-color" content="#fff" />
    <script id="theme-bootstrap">
      /** 在入口资源加载前恢复主题，仅为服务端确认的默认首页启用深色底。 */
      ;(function () {
        var root = document.documentElement
        var theme = 'system'
        try {
          var stored = document.cookie.match(/(?:^|;\s*)vite-ui-theme=([^;]*)/)
          if (stored && /^(light|dark|system)$/.test(stored[1])) {
            theme = stored[1]
          }
        } catch {
          // 浏览器禁用 Cookie 时仍按系统主题显示。
        }
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.add(dark ? 'dark' : 'light')
        if (
          window.location.pathname === '/' &&
          document.querySelector('meta[name="mansui-home-mode"]')?.content ===
            'default'
        ) {
          root.dataset.homeBoot = 'default'
          // 入口资源加载失败时恢复可读正文，避免蒙版永久阻挡页面。
          window.setTimeout(function () {
            delete root.dataset.homeBoot
          }, 15000)
        }
      })()
    </script>
    <style>
      html {
        background: #fff;
      }
      html.dark {
        color-scheme: dark;
        background: oklch(0.235 0 0);
      }
      body {
        margin: 0;
      }
      html[data-home-boot='default'],
      html[data-home-boot='default'] body,
      html:has(meta[name='mansui-home-mode'][content='default']),
      html:has(meta[name='mansui-home-mode'][content='default']) body {
        color-scheme: dark;
        color: #e6f3f8;
        background: #03070b;
      }
      #public-seo-content {
        box-sizing: border-box;
        min-height: 100svh;
        max-width: 64rem;
        margin: auto;
        padding: clamp(3rem, 10vh, 8rem) 1.5rem;
        font-family: system-ui, sans-serif;
        line-height: 1.7;
      }
      #public-seo-content h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
        line-height: 1.2;
      }
      #public-seo-content p {
        margin-block: 1.5rem;
      }
      #public-seo-content nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.5rem;
      }
      #public-seo-content a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.25em;
      }
      #home-boot-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: rgb(3 7 11 / 84%);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }
      html[data-home-boot='default'] #home-boot-overlay {
        display: flex;
      }
      #home-boot-overlay::before {
        content: '';
        position: absolute;
        width: min(26rem, 80vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(91 170 203 / 12%),
          transparent 68%
        );
        pointer-events: none;
      }
      #home-boot-overlay img {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow:
          0 0 0 1px rgb(187 230 246 / 24%),
          0 0 36px rgb(75 158 190 / 16%);
      }
      .home-boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgb(185 225 242 / 18%);
        border-top-color: #b9e1f2;
        border-radius: 50%;
        animation: home-boot-spin 0.9s linear infinite;
      }
      @keyframes home-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .home-boot-spinner {
          animation: none;
        }
      }
    </style>
